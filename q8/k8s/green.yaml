apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
      color: green
  template:
    metadata:
      labels:
        app: demo
        color: green
    spec:
      containers:
      - name: demo
        image: dhayan05/devops-lab:q8
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: green-1
